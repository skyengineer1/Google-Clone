<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/2c36cd333a.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <title>Google</title>
</head>
<body>
    <nav>
        <p class="gmail">Gmail</p>
        <p class="images">Images</p>
        <i class="fa-solid fa-earth-americas" style="color: #ffffff;"></i>
        <button class="sign">Sign in</button>
    </nav>

    <main>
        <img src="images/logo.png" alt="Google's Logo" class="logo">
        <input type="search"  placeholder="Search Google or type a URL">
        <div class="buttons">
            <button class="search">Google Search</button>
            <button class="lucky">I'm Feeling Lucky</button>
        </div>
        <p class="google-offer">Google offered in: <span class="offer">ქართული</span></p>
    </main>

    <footer>
        <div class="top">
            <p class="georgia">Georgia</p>
        </div>
        <div class="bottom">
            <div class="left">
                <p class="about">About</p>
                <p class="advertising">Advertising</p>
                <p class="business">Business</p>
                <p class="works">How Search Works</p>
            </div>
            <div class="right">
                <p class="privacy">Privacy</p>
                <p class="terms">Terms</p>
                <p class="settings">Settings</p>
            </div>
        </div>
    </footer>
</body>
</html>
